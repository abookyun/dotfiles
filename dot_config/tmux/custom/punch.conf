# vim:set ft=tmux:
# Catppuccin status module for punch.
#
# tmux is the one place the tracking state stays visible without returning to
# a prompt, so this carries the same two states the shell hint cares about:
# clocked in somewhere, or not clocked in at all.
#
# Colour is the signal here. Clocked in reads as calm (green); clocked out
# while sitting in a project reads as attention-worthy (yellow), because that
# is the state that silently loses time.

%hidden MODULE_NAME="punch"

# Both halves read the same #() string so tmux runs the command once per
# refresh rather than twice. The output is "<state>|<text>", where state is
# `in` or `out`, so the colour is a prefix test rather than a second call.
set -ogq "@catppuccin_${MODULE_NAME}_icon" ""
set -ogqF "@catppuccin_${MODULE_NAME}_color" \
  "#{?#{m:in|*,#(punch tmux-status)},#{E:@thm_green},#{E:@thm_yellow}}"
set -ogq "@catppuccin_${MODULE_NAME}_text" " #{s:*|:: #(punch tmux-status)}"

source "${XDG_DATA_HOME}/tmux/plugins/tmux/utils/status_module.conf"
